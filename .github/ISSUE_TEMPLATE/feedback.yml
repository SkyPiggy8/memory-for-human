name: 文档与使用反馈
description: 说说哪道题不好回答，或在哪一步卡住了
title: "[反馈] "
body:
  - type: markdown
    attributes:
      value: "请写清使用语言、浏览器和卡住的步骤。用虚构或匿名化例子说明，不上传私人聊天、照片、录音或 Key。"
  - type: dropdown
    id: scene
    attributes:
      label: 回忆录类型
      options:
        - 恋人
        - 婚姻
        - 老人一生
        - 战友
        - 同事
        - 同学
        - 通用文档
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 在哪一步遇到什么问题？
      description: 可以贴文档位置或题目，例子请先去掉私人信息。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 希望怎样改进？
