name: 功能建议
description: 告诉我们你想完成什么，现在还缺哪一步
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: "先看看 docs/roadmap.md，再说你希望怎样用。描述事情就好，不用附私人原件。"
  - type: textarea
    id: scenario
    attributes:
      label: 谁在什么情况下需要这个功能？
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 希望得到什么结果？
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: 现在怎样完成这件事？
