<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Memory for Human：怎样写好一章回忆录</title>
  <desc id="desc">第一步记下真实故事；第二步交给自己的 AI 追问和整理；第三步由本人检查修改；第四步下载备份、导出文稿或打印。AI 可通过网页 API 或手动复制说明使用。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#667085" stroke-width="1.8" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="900" height="420" rx="18" fill="#ffffff"/>
  <g fill="none" stroke="#667085" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M 410 102 H 486"/>
    <path d="M 686 184 V 210 H 214 V 240"/>
    <path d="M 410 324 H 486"/>
  </g>
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
    <rect x="20" y="20" width="390" height="164" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <circle cx="58" cy="58" r="19" fill="#2563eb"/><text x="58" y="66" text-anchor="middle" fill="white" font-size="24" font-weight="700">1</text>
    <text x="92" y="69" fill="#153c72" font-size="32" font-weight="600">记下你想写的故事</text>
    <text x="42" y="116" fill="#42526b" font-size="24">选一种回忆录，回答一个问题</text>
    <text x="42" y="152" fill="#42526b" font-size="24">已有日记、聊天文字也能放进来</text>

    <rect x="490" y="20" width="390" height="164" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <circle cx="528" cy="58" r="19" fill="#15803d"/><text x="528" y="66" text-anchor="middle" fill="white" font-size="24" font-weight="700">2</text>
    <text x="562" y="69" fill="#195735" font-size="32" font-weight="600">让自己的 AI 帮忙</text>
    <text x="512" y="116" fill="#42526b" font-size="24">接着你的回答问，再整理成一章</text>
    <text x="512" y="152" fill="#42526b" font-size="24">填 Key，或复制说明给自己的 AI</text>

    <rect x="20" y="242" width="390" height="164" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <circle cx="58" cy="280" r="19" fill="#c2410c"/><text x="58" y="288" text-anchor="middle" fill="white" font-size="24" font-weight="700">3</text>
    <text x="92" y="291" fill="#7c3416" font-size="32" font-weight="600">自己读一遍，改一改</text>
    <text x="42" y="338" fill="#42526b" font-size="24">核对人名、时间和事情经过</text>
    <text x="42" y="374" fill="#42526b" font-size="24">记不清的地方，就保留“记不清”</text>

    <rect x="490" y="242" width="390" height="164" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
    <circle cx="528" cy="280" r="19" fill="#6d28d9"/><text x="528" y="288" text-anchor="middle" fill="white" font-size="24" font-weight="700">4</text>
    <text x="562" y="291" fill="#4c2678" font-size="32" font-weight="600">保存下来，或打印</text>
    <text x="512" y="338" fill="#42526b" font-size="24">下载备份，下次还可以接着写</text>
    <text x="512" y="374" fill="#42526b" font-size="24">导出文字、存成 PDF，或打印</text>
  </g>
</svg>
